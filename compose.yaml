# NOTE: deploy
# docker node update --label-add qbittorrent=true `docker node inspect self --format "{{ .ID }}"`

services:
  qbittorrent:
    image: ghcr.io/zerocluster/qbittorrent
    init: true
    stop_grace_period: 5m

    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - "node.labels.qbittorrent == true"

    command: run

    secrets:
      - { source: qbittorrent_env.yaml, target: /var/local/package/env.yaml }

    networks: [network]

    volumes:
      - { type: tmpfs, target: /dev/shm, tmpfs: { size: 1073741824 } }
      - { type: volume, source: qbittorrent, target: /var/local/package/data }

    build:
      context: .
      secrets:
        - id=GITHUB_TOKEN,env=GITHUB_TOKEN

secrets:
  qbittorrent_env.yaml: { file: env.yaml }

networks:
  network: ~

volumes:
  qbittorrent: ~
