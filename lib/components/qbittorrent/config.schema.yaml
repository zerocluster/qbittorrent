- $id: config
  type: object
  properties:
    username: { type: string }
    httpPort: { type: integer, format: ip-port }
    torrentPort: { type: integer, format: ip-port }

    nginx:
      type: object
      properties:
        enabled: { type: boolean }
        httpPort: { type: integer, format: ip-port }
        httpsPort: { type: integer, format: ip-port }
        torrentPort: { type: integer, format: ip-port }
        serverNames:
          anyOf:
            - type: "null"
            - { type: string, format: nginx-server-name }
            - { type: array, items: { type: string, format: nginx-server-name }, minItems: 1, uniqueItems: true }

      additionalProperties: false
      required: [enabled, httpPort, httpsPort, torrentPort, serverNames]

  additionalProperties: false
  required: [username, httpPort, torrentPort, nginx]
